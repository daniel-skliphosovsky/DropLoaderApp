name: Feature Request
about: Suggest a new feature for MediaHub
title: "Feature: "
labels: "enhancement"
body:
  - type: textarea
    id: problem-goal
    attributes:
      label: Problem/Goal
      description: Clear description of what you want to achieve
      placeholder: e.g., I want to download TikTok playlists
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How you think it could be implemented (optional)
      placeholder: e.g., Add a playlist downloader feature
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you've considered (optional)
      placeholder: e.g., Use an existing library
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any relevant information
      placeholder: e.g., Use cases, benefits, etc.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - type: checkbox
          label: I have searched for existing issues and found none related to this feature
        - type: checkbox
          label: I am willing to contribute to this feature request