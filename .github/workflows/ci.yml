name: CI - DropLoaderApp

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build TikTokExplode DLL
        run: |
          dotnet publish ../TikTokExplode/src/TikTokExplode/TikTokExplode.csproj --configuration Release --output ./lib

      - name: Restore
        run: dotnet restore src/DropLoaderApp.sln

      - name: Build
        run: dotnet build src/DropLoaderApp.App/DropLoaderApp.App.csproj -f net8.0-windows10.0.19041.0 --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/DropLoaderApp.Tests/DropLoaderApp.Tests.csproj --configuration Release --no-restore
