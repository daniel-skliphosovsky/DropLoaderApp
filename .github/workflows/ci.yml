name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore src/DropLoaderApp.App/DropLoaderApp.App.csproj
      - name: Build
        run: dotnet build src/DropLoaderApp.App/DropLoaderApp.App.csproj --configuration Release --no-restore
