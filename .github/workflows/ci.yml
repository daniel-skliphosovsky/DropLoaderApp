name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore
        run: dotnet restore src/DropLoaderApp.App/DropLoaderApp.App.csproj -p:RuntimeIdentifier=win-x64
      - name: Build
        run: dotnet build src/DropLoaderApp.App/DropLoaderApp.App.csproj --framework net9.0-windows10.0.19041.0 --configuration Release --no-restore -p:RuntimeIdentifier=win-x64
