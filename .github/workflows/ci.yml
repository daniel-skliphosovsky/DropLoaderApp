name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build Windows
        run: dotnet build src/DropLoader/DropLoader.csproj -c Release -f net9.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:UseMonoRuntime=false

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build macOS
        run: dotnet build src/DropLoader.sln -c Release -f net9.0-maccatalyst
