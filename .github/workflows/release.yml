name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MAUI
        run: dotnet workload install maui
      - name: Restore
        run: dotnet restore src/DropLoaderApp.App/DropLoaderApp.App.csproj
      - name: Publish macOS
        run: |
          dotnet publish src/DropLoaderApp.App/DropLoaderApp.App.csproj \
            -f net9.0-maccatalyst -c Release \
            --self-contained true -o ./publish/macos
      - name: Zip
        run: cd publish/macos && zip -r ../DropLoaderApp-macos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: publish/DropLoaderApp-macos.zip
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MAUI
        run: dotnet workload install maui
      - name: Restore
        run: dotnet restore src/DropLoaderApp.App/DropLoaderApp.App.csproj
      - name: Publish Windows
        run: |
          dotnet publish src/DropLoaderApp.App/DropLoaderApp.App.csproj \
            -f net9.0-windows10.0.19041.0 -c Release \
            --self-contained true -o ./publish/windows
      - name: Zip
        run: |
          cd publish/windows
          powershell Compress-Archive -Path . -DestinationPath ../DropLoaderApp-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: publish/DropLoaderApp-windows.zip
          retention-days: 7

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            macos/DropLoaderApp-macos.zip \
            windows/DropLoaderApp-windows.zip \
            --generate-notes --title "${{ github.ref_name }}" --latest
        env:
          GH_TOKEN: ${{ github.token }}
