name: CD - Release Builds

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build TikTokExplode DLL
        run: |
          dotnet publish ../TikTokExplode/src/TikTokExplode/TikTokExplode.csproj --configuration Release --output ./lib

      - name: Restore
        run: dotnet restore src/DropLoaderApp.sln

      - name: Publish Windows
        run: |
          dotnet publish src/DropLoaderApp.App/DropLoaderApp.App.csproj `
            -f net8.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -p:TrimMode=partial `
            -c Release `
            -o ./publish/win-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLoaderApp-Windows
          path: ./publish/win-x64/DropLoaderApp.App.exe

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build TikTokExplode DLL
        run: |
          dotnet publish ../TikTokExplode/src/TikTokExplode/TikTokExplode.csproj --configuration Release --output ./lib

      - name: Restore
        run: dotnet restore src/DropLoaderApp.sln

      - name: Publish macOS
        run: |
          dotnet publish src/DropLoaderApp.App/DropLoaderApp.App.csproj `
            -f net8.0-maccatalyst `
            -r maccatalyst-x64 `
            --self-contained true `
            -p:CreatePackage=true `
            -c Release `
            -o ./publish/maccatalyst-x64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLoaderApp-macOS
          path: ./publish/maccatalyst-x64/*.pkg
