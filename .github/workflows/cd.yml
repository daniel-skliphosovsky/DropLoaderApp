name: CD - Release Builds

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore src/DropLoaderApp.sln

      - name: Publish Windows (self-contained exe)
        shell: pwsh
        run: |
          dotnet publish src/DropLoaderApp.App/DropLoaderApp.App.csproj `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -p:TrimMode=partial `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -c Release `
            -o ./publish/win-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLoaderApp-Windows
          path: ./publish/win-x64/DropLoaderApp.App.exe
          retention-days: 30

  build-macos:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache MAUI workload
        uses: actions/cache@v4
        id: cache-maui
        with:
          path: /usr/local/share/dotnet/packs
          key: ${{ runner.os }}-maui-${{ hashFiles('**/DropLoaderApp.App.csproj') }}
          restore-keys: |
            ${{ runner.os }}-maui-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        if: steps.cache-maui.outputs.cache-hit != 'true'
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore src/DropLoaderApp.sln

      - name: Publish macOS (.pkg)
        shell: bash
        run: |
          dotnet publish src/DropLoaderApp.App/DropLoaderApp.App.csproj \
            -f net10.0-maccatalyst \
            -r maccatalyst-x64 \
            --self-contained true \
            -p:CreatePackage=true \
            -c Release \
            -o ./publish/maccatalyst-x64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLoaderApp-macOS
          path: ./publish/maccatalyst-x64/*.pkg
          retention-days: 30
